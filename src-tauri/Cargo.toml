[package]
name = "scrcpy-gui"
version = "1.3.1"
description = "scrcpy GUI en Rust"
authors = ["danieth-dev"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tokio = { version = "1.43", features = ["rt-multi-thread", "process", "time", "sync", "io-util", "net", "macros"] }
futures = "0.3"
regex = "1.11"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
libloading = "0.9.0"
yuvutils-rs = { version = "0.8.3", features = ["rayon"] }
