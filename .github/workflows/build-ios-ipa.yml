name: Build ScrcpyCam iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Setup iOS compilation
        run: |
          set -e -o pipefail
          mkdir -p build/Payload/ScrcpyCam.app
          
          echo "Compilando Swift para arquitectura arm64 de iOS..."
          xcrun --sdk iphoneos swiftc \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
            -framework SwiftUI \
            -framework AVFoundation \
            -framework VideoToolbox \
            -framework Network \
            -framework UIKit \
            ios/ScrcpyCam/CameraManager.swift \
            ios/ScrcpyCam/H264Encoder.swift \
            ios/ScrcpyCam/USBServer.swift \
            ios/ScrcpyCam/ContentView.swift \
            ios/ScrcpyCam/ScrcpyCamApp.swift \
            -o build/Payload/ScrcpyCam.app/ScrcpyCam 2>&1 | tee compile.log

          cp ios/ScrcpyCam/Info.plist build/Payload/ScrcpyCam.app/Info.plist

          echo "Firmando paquete ad-hoc..."
          codesign --force --deep --sign - build/Payload/ScrcpyCam.app

          echo "Creando paquete ScrcpyCam.ipa..."
          cd build
          zip -r ScrcpyCam.ipa Payload

      - name: Upload Compile Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: compile.log

      - name: Upload ScrcpyCam.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrcpyCam-ipa
          path: build/ScrcpyCam.ipa

      - name: Publish Public Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ios-v1.0
          name: ScrcpyCam iOS v1.0 (.ipa)
          body: |
            Descarga `ScrcpyCam.ipa` e instálalo en tu iPhone usando Sideloadly para streaming directo por cable USB (0 latencia, modo pantalla apagada OLED).
          files: build/ScrcpyCam.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
